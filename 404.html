<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved</title>
<link rel="canonical" href="https://tenniskb.github.io/">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;
       background:#fff;color:#1c1917}
  main{text-align:center;padding:2rem;max-width:34rem}
  h1{font-size:1.4rem;margin:0 0 .6rem;color:#047857}
  p{margin:.4rem 0;color:#78716c;line-height:1.6}
  a{color:#059669;font-weight:600}
  code{background:#f5f5f4;padding:.1rem .3rem;border-radius:3px;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>This page has moved</h1>
  <p>The consolidated Tennis Knowledge Base now lives at
     <a href="https://tenniskb.github.io/">https://tenniskb.github.io/</a>.</p>
  <p id="dest"></p>
  <p><a id="go" href="https://tenniskb.github.io/">Continue &rarr;</a></p>
</main>
<script>
(function () {
  var PREFIX = "/tnkb-mkdocs";
  var TARGET = "https://tenniskb.github.io";
  var p = location.pathname || "/";
  if (p.indexOf(PREFIX) === 0) { p = p.slice(PREFIX.length); }
  if (!p) { p = "/"; }
  if (p.charAt(0) !== "/") { p = "/" + p; }
  var dest = TARGET + p + location.search + location.hash;
  var go = document.getElementById("go");
  if (go) { go.setAttribute("href", dest); }
  var d = document.getElementById("dest");
  if (d) {
    d.innerHTML = "Redirecting to <code>" +
      dest.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</code>";
  }
  location.replace(dest);
})();
</script>
</body>
</html>
